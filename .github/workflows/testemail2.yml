# 👇 这行就是解决报错的关键！
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

name: Cypress CI 自动化测试

jobs:
  get-operator-email:
    runs-on: ubuntu-latest
    steps:
      - name: Get operator email
        run: |
          # 手动触发的操作者
          OPERATOR="${{ github.triggering_actor }}"
          # 标准 GitHub 隐私邮箱（一定存在）
          EMAIL="${OPERATOR}@users.noreply.github.com"
          
          echo "OPERATOR=$OPERATOR" >> $GITHUB_ENV
          echo "OPERATOR_EMAIL=$EMAIL" >> $GITHUB_ENV

      - name: Show result
        run: |
          echo "操作者: ${{ env.OPERATOR }}"
          echo "邮箱: ${{ env.OPERATOR_EMAIL }}"
