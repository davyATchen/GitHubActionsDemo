name: Auto Cypress E2E + email+ slack
env:
  email: "AAAA"
on:
  schedule:
    # UTC time
    - cron: '20 15 * * *'     #${{ secrets.SCHEDULE }}
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # uses:  Node.js env:
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # uses: npm install to replace npm ci，fix lockfile
      - name: Install dependencies
        run: npm install

      # run:  Cypress test
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
        env:
          CI: true
          CYPRESS_CASENAME: "cypress/e2e/**/*.cy.js" # ${{ inputs.casename }}

      # ====================log output  ====================
      - name: Generate Cypress report and log
        if: always()
        run: |
          # Generate JSON report
          npx cypress run --reporter json > cypress-report.json 2>&1 || true
          # log to console
          cat cypress-report.json

      # ==================== Success/failed/skiped ====================
      - name: Success/failed/skiped 
        if: always()
        id: parse
        run: |
          PASSED=$(jq -r '.stats.passed // 0' test-results.json 2>/dev/null || echo 0)
          FAILED=$(jq -r '.stats.failed // 0' test-results.json 2>/dev/null || echo 0)
          SKIPPED=$(jq -r '.stats.skipped // 0' test-results.json 2>/dev/null || echo 0)
          TOTAL=$(jq -r '.stats.tests // 0' test-results.json 2>/dev/null || echo 0)
          STATUS=$([ "$FAILED" -gt 0 ] && echo "failed" || echo "success")

          # write env var
         
          echo "STATUS=$STATUS" >> $GITHUB_ENV
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "SKIPPED=$SKIPPED" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV
          echo $PASSED $FAILED $SKIPPED $TOTAL
 
      - name: get current user email
        id: get-email
        run: |
          # get trigger email
          email=$(gh api users/${{ github.actor }} --jq '.email')
          echo $email
          echo "email=$email" >> $GITHUB_ENV
          echo ${{ env.email }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # =============================================
      # ✅ fix send email
      # =============================================
      - name: send email
        if: always()  
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: Auto Cypress test result ${{ job.status }}
          body: |
            Finish！
            case：${{ inputs.casename }}
            status：${{ job.status }}
          to: ${{ secrets.EMAIL_TO }} # ${{ env.email }}
          from: GitHub Actions
          # HTMLformat 
          html_body: |
            <h3>Cypress Auto result ${{ job.status }}</h3>
            <p>click below to see details：</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            See GitHub Actions run result
            </a></p>
      # ==============================================
      # Send result to Slack
      # ==============================================
      - name: Send result to Slack
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🧪 Cypress Auto test result\n\n📦 project：${{ github.repository }}\n👤 opearator：${{ github.actor }}\n✅ Status：${{ job.status }}\n🔗 see log：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
